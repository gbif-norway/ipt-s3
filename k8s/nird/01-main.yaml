apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-ipt
  labels:
    app: main-ipt
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: main-ipt
  template:
    metadata:
      labels:
        app: main-ipt
    spec:
      containers:
        - name: main-ipt
          image: gbifnorway/ipt:3.3.2-ojdbc-23.2-4cc5822
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: 2Gi
              cpu: "1"
            requests:
              memory: 1Gi
              cpu: "0.5"
          volumeMounts:
            - name: ipt-data
              mountPath: /srv/ipt/
              subPath: ipt-main
      volumes:
        - name: ipt-data
          persistentVolumeClaim:
            claimName: 573890b9-3346-4027-ab0c-22eec6dfd665
---
apiVersion: v1
kind: Service
metadata:
  name: main-ipt
  labels:
    app: main-ipt
spec:
  selector:
    app: main-ipt
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ipt
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 10000m
spec:
  ingressClassName: nginx
  rules:
    - host: ipt.gbif.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-ipt
                port:
                  number: 80
  tls:
    - hosts:
        - ipt.gbif.no
      secretName: main-ipt-cert
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: main-ipt
spec:
  podSelector:
    matchLabels:
      app: main-ipt
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: kube-ingress
      ports:
        - protocol: TCP
          port: 8080
